name: Docs to GitHub Pages

# Publishes the operating docs (apps/docs) to GitHub Pages, deployed straight
# from this workflow (Settings > Pages > Source: GitHub Actions).
#
# That setting is the switch: any other source, or Pages off, skips publishing.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A deploy that has started runs to the end; a newer one waits for it.
concurrency:
  group: docs-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pages: read
    outputs:
      url: ${{ steps.check.outputs.url }}
    steps:
      # Pages' address, custom domain included.
      - name: Check GitHub Pages
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if pages=$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>/dev/null) &&
            [ "$(jq -r .build_type <<<"$pages")" = workflow ]; then
            url=$(jq -r .html_url <<<"$pages")
            echo "url=${url%/}/" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages does not deploy from GitHub Actions, so the docs are not published. To publish them, set Settings > Pages > Source: GitHub Actions."
          fi

  publish:
    needs: pages
    if: needs.pages.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the docs
        env:
          DOCS_URL: ${{ needs.pages.outputs.url }}
        run: pnpm exec turbo run build --filter=@app/docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
